name: Build OUTBLOCK TUNE VST3 Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target OutblockTune_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $src = "build/OutblockTune_artefacts/Release/VST3/OUTBLOCK TUNE.vst3"
          if (!(Test-Path $src)) { throw "VST3 output not found at $src" }
          Compress-Archive -Path $src -DestinationPath "OUTBLOCK_TUNE_VST3_WINDOWS.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OUTBLOCK-TUNE-VST3-WINDOWS
          path: OUTBLOCK_TUNE_VST3_WINDOWS.zip
